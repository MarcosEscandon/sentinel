name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -e ".[dev,signing,hardening]"
      - name: Lint
        run: python -m ruff check .
      - name: Static analysis
        run: python -m bandit -r sentinel -x tests
      - name: Tests
        run: python -m pytest -q
      - name: Selftest
        run: sentinel selftest
      - name: Security audit
        run: sentinel audit

  sca:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Generate requirements from extras
        run: |
          python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(chr(10).join(sorted({dep for deps in d['project']['optional-dependencies'].values() for dep in deps})))" | Set-Content -Path requirements-audit.txt -Encoding UTF8
      - name: Audit dependencies
        run: python -m pip_audit -r requirements-audit.txt
